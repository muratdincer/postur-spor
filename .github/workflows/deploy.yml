name: Firebase deploy

# main'e gelen her değişiklikte Hosting + Firestore kurallarını + program şablonlarını yayınlar.
# Gerekli secret: FIREBASE_SERVICE_ACCOUNT (servis hesabı JSON anahtarının tamamı).
# Hosting her seferinde; Firestore kuralları yalnızca firestore.rules, şablonlar yalnızca programs/ veya
# scripts/publish-programs.mjs değiştiğinde (ya da elle çalıştırmada) yayınlanır.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
      - "firestore.rules"
      - "programs/**"
      - "scripts/**"
      - ".firebaserc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Program şablonlarını doğrula
        run: for f in programs/*.json; do jq empty "$f" || exit 1; done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Hosting deploy
        run: npx --yes firebase-tools@13 deploy --only hosting --project postur-spor --non-interactive

      # Kurallar yalnızca firestore.rules değiştiyse (veya elle çalıştırmada) yayınlanır.
      # Servis hesabında "Firebase Rules Admin" rolü gerekir.
      - name: Firestore kuralları değişti mi?
        id: rules
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || ! git diff --quiet "$BEFORE" HEAD -- firestore.rules; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Firestore kuralları deploy
        if: steps.rules.outputs.changed == 'true'
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project postur-spor --non-interactive

      # Program şablonları (kişisel sağlık notları içerir) Hosting'e değil Firestore'a yazılır.
      # Servis hesabında "Cloud Datastore User" rolü gerekir.
      - name: Program şablonları değişti mi?
        id: programs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || ! git diff --quiet "$BEFORE" HEAD -- programs scripts/publish-programs.mjs; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Program şablonlarını Firestore'a yaz
        if: steps.programs.outputs.changed == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix scripts firebase-admin@12
          node scripts/publish-programs.mjs
